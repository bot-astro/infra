apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: astro-appset
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/bot-astro/infra.git
        revision: HEAD
        directories:
          - path: apps/*/envs/*
  template:
    metadata:
      # apps/<app>/envs/<env> -> <app>-<env>, deployed in the <env> namespace
      name: "{{index .path.segments 1}}-{{index .path.segments 3}}"
    spec:
      project: default
      source:
        repoURL: https://github.com/bot-astro/infra.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{index .path.segments 3}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          prune: true
          selfHeal: false
