# Id of the Infisical machine identity (Kubernetes Auth) the operator uses in the "astro-staging" namespace.
#
# Generate the real one:
#   1. Infisical -> Organization -> Access Control -> Machine Identities -> the identity -> copy its "Identity ID".
#   2. Copy this file to infisical-kubernetes-credentials-secret.yml in this folder (gitignored) and replace the value below.
#   3. Seal it, from the root of the infra repo:  scripts/seal-secrets.sh infisical
#      This writes infisical-kubernetes-credentials-secret-sealed.yml in the env folder.
#   4. Add that file to resources: in ../kustomization.yml and commit it.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-kubernetes-credentials
  namespace: astro-staging
type: Opaque
stringData:
  identityId: id_of_the_infisical_machine_identity
