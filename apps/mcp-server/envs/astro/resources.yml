apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-server
spec:
  template:
    spec:
      containers:
        - name: mcp-server
          env:
            # keeps the V8 heap well under the container limit, the rest is for buffers and native memory
            - name: NODE_OPTIONS
              value: --max-old-space-size=128
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 192Mi
