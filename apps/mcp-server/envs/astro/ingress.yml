apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-server
spec:
  tls:
    - hosts:
        - mcp.astro-bot.space
      secretName: mcp-server-tls
  rules:
    - host: mcp.astro-bot.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mcp-server
                port:
                  number: 9002
