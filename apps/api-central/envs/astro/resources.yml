apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-central
spec:
  template:
    spec:
      containers:
        - name: api-central
          env:
            # glibc creates up to 8 malloc arenas per core, and the JVM sees every core of the node (no cpu limit)
            - name: MALLOC_ARENA_MAX
              value: "2"
          resources:
            # no cpu limit on purpose: startup needs a burst of cpu that the node can share
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              memory: 640Mi
