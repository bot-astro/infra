apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-central
spec:
  template:
    spec:
      # with 2 replicas, never put both on the same node
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: api-central
