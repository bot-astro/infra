# Pull secret for ghcr.io/bot-astro/* images. Used by every workload in the "astro-staging" namespace.
#
# Generate the real one:
#   1. Create a GitHub classic personal access token with only the read:packages scope
#      (or reuse the one in the Semaphore "github" secret / the existing docker-registry secret).
#   2. Create the file next to this one (it is gitignored) from the command below, run from the root of the infra repo:
#        kubectl create secret docker-registry docker-registry \
#          --namespace astro-staging \
#          --docker-server=ghcr.io \
#          --docker-username=<github-username> \
#          --docker-password=<token> \
#          --dry-run=client -o yaml > apps/registry/envs/astro-staging/secrets/docker-config-secret.yml
#      Shortcut, copy the one already in the cluster instead of creating a token:
#        kubectl get secret docker-registry -n astro -o json \
#          | jq '{apiVersion, kind, type, metadata: {name: "docker-registry", namespace: "astro-staging"}, data}' \
#          > apps/registry/envs/astro-staging/secrets/docker-config-secret.yml
#   3. Seal it (needs kubectl access to the cluster, the sealed secret can only be decrypted by it, for this name and namespace):
#        scripts/seal-secrets.sh registry
#      This writes docker-config-secret-sealed.yml in the env folder, commit that one.
#   4. Never commit docker-config-secret.yml (the .gitignore already excludes it).
apiVersion: v1
kind: Secret
metadata:
  name: docker-registry
  namespace: astro-staging
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: base64_encoded_docker_config_json
