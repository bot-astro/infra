apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - infisical-secret.yml

generatorOptions:
  disableNameSuffixHash: true

# Picked up by the Grafana sidecars of kube-prometheus-stack (label grafana_dashboard / grafana_alert)
configMapGenerator:
  - name: grafana-dashboard-astro-overview
    files:
      - dashboards/astro-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Astro
  - name: grafana-dashboard-astro-bot
    files:
      - dashboards/astro-bot.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Astro
  - name: grafana-dashboard-astro-voice
    files:
      - dashboards/astro-voice.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Astro
  - name: grafana-dashboard-astro-resources
    files:
      - dashboards/astro-resources.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Astro
  - name: grafana-dashboard-astro-mcp-server
    files:
      - dashboards/astro-mcp-server.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Astro
  - name: grafana-alerting-astro
    files:
      - alerting.yml
    options:
      labels:
        grafana_alert: "1"
