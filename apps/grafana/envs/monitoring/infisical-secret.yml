# Grafana alerting reads DISCORD_WEBHOOK_URL from this Secret (grafana.envFromSecrets in the gport kube-prometheus-stack values).
# It reuses the InfisicalAuth that lives in the astro namespace, so no extra credentials are needed in monitoring.
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: grafana-alerting
spec:
  infisicalAuthRef:
    name: infisical-auth
    namespace: astro
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectId: b9071f19-b984-4138-a1e8-a15c67e02603
      environmentSlug: prod
      secretPath: /monitoring
  targets:
    - name: grafana-alerting
      namespace: monitoring
      kind: Secret
      creationPolicy: Owner
