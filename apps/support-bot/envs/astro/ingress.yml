apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-bot
spec:
  tls:
    - hosts:
        - support-bot.astro-bot.space
      secretName: support-bot-tls
  rules:
    - host: support-bot.astro-bot.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: support-bot
                port:
                  number: 9002
