apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: support-bot
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod-dns
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - placeholder.astro-bot.space
      secretName: support-bot-tls
  rules:
    - host: placeholder.astro-bot.space
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: support-bot
                port:
                  number: 9002
