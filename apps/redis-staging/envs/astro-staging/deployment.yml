# Redis for staging only, not persistent: staging data is disposable. Named redis-staging so that Kubernetes does not inject
# REDIS_PORT/REDIS_HOST service variables into the pods of the namespace, they would clash with the apps config.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-staging
  labels:
    app: redis-staging
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis-staging
  template:
    metadata:
      labels:
        app: redis-staging
    spec:
      nodeSelector:
        gport.giuliopime.dev/agent: as-cruiser
      containers:
        - name: redis
          image: redis:8.6
          command:
            - sh
            - -c
            - exec redis-server --requirepass "$REDIS_PASSWORD" --save "" --appendonly no --maxmemory 200mb --maxmemory-policy noeviction
          ports:
            - name: redis
              containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-staging-config
                  key: REDIS_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 256Mi
